<!DOCTYPE html>
<html>
    <head>
        <title>Students</title>
    </head>
    <body>

        <h1>Students List</h1>

        <table border="1">
            <tr>
                <th>Id</th>
                <th>Name</th>
                <th>City</th>
                <th>Age</th>
            </tr>
            {% for student in students %}

            <tr>
                <td>{{ student[0] }}</td>
                <td>{{ student[1] }}</td>
                <td>{{ student[2] }}</td>
                <td>{{ student[3] }}</td>
            </tr>
            {% endfor %}
        </table>
    </body>

</html>
